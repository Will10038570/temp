# TensorRT 量化測試設定檔
# 所有可調整的參數、決策點都集中於此，不需修改任何 Python 程式碼。

# ── Paths ─────────────────────────────────────────────────────────────────────
# 所有路徑皆相對於專案根目錄（src/ 的上一層）
paths:
  weights:     "models/pretrained/yolo11s.pt"
  kept_frames: "data/coda/raw/CODa_tiny/kept_frames.csv"
  coda_root:   "data/coda/raw/CODa_tiny"
  outdir:      "outputs"

# ── Calibration Sampling ──────────────────────────────────────────────────────
calibration:
  n:    300      # INT8/FP8 PTQ 校正幀數（建議 200–500）
  seed: 42       # 隨機種子，確保可重現
  cam:  "cam0"   # 讀校正影像用的相機

# ── TRT Export（各精度共用）──────────────────────────────────────────────────
export:
  imgsz:      1280              # YOLO 推論解析度（需與 run_pipeline.py --imgsz 一致）
  onnx_opset: 17                # ONNX opset（TRT 10.x 最高相容版本）
  device:     "0"               # GPU device id
  precisions: [fp32, fp16, int8, fp8]   # 要導出的精度；移除不需要的項目即可

# ── INT8 PTQ ──────────────────────────────────────────────────────────────────
int8:
  calib_algo:  "entropy"   # 校正演算法：entropy | percentile | mse
  percentile:  99.9        # calib_algo == "percentile" 時生效
  # ↓ sensitivity analysis 後填入層名，不需修改任何程式碼
  skip_layers: []

# ── FP8 PTQ ───────────────────────────────────────────────────────────────────
fp8:
  # ↓ sensitivity analysis 後填入層名，不需修改任何程式碼
  skip_layers: []

# ── Sensitivity Analysis ──────────────────────────────────────────────────────
sensitivity:
  n_subset:  50        # 計算 output MSE 用的子集幀數（越大越準，越慢）
  precision: "int8"    # 對哪個精度做分析：int8 | fp8

# ── Pipeline（run_pipeline.py 參數）─────────────────────────────────────────
pipeline:
  cam:        "cam0"
  conf:       0.25     # YOLO confidence threshold
  iou_nms:    0.70     # NMS IoU threshold
  num_frames: null     # null = 全部；填整數可限制幀數（除錯用）

# ── Evaluation（run_eval.py 參數）────────────────────────────────────────────
evaluation:
  iou_thr:       0.5   # GT 與 pred 框配對的 IoU 門檻
  min_gt_points: 5     # GT box 內點數少於此值時不算距離誤差

# ── Distance Config（對應 q1/pipeline.py DistanceConfig）────────────────────
distance:
  min_range:   0.5
  min_depth:   0.5
  ground_thr:  0.15
  shrink:      0.8
  eps_min:     0.3
  eps_k:       2.0
  min_points:  3
  min_ratio:   0.3
  w_center:    0.5
  w_cov:       0.5
  min_cluster: 5

# ── Comparison Report ─────────────────────────────────────────────────────────
compare:
  labels: [fp32, fp16, int8, fp8]
  out:    "outputs/comparison_table.md"
