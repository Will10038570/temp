# TensorRT 量化流程設定檔（calib_sample / export_trt / quant_inspect / compare_quant）
# 共用路徑（weights、kept_frames、coda_root、outputs）見 paths.yaml
# run_pipeline / run_eval 的參數分別見 pipeline.yaml、eval.yaml

# ── Calibration Sampling ──────────────────────────────────────────────────────
calibration:
  n:    300      # INT8/FP8 PTQ 校正幀數（建議 200–500）
  seed: 42       # 隨機種子，確保可重現
  cam:  "cam0"   # 讀校正影像用的相機
  # ONNX PTQ 校正時 onnxruntime 的 execution provider 優先順序（可選 cpu、cuda:0、trt）
  # 預設只用 cpu：ultralytics 原始碼註明 modelopt 的 CUDA EP 可能因 cuDNN ABI 不合而 segfault；
  # 校正出的 scale 與 EP 無關，只差在速度
  eps:  ["cpu"]

# ── TRT Export（各精度共用）──────────────────────────────────────────────────
export:
  imgsz:      1280              # engine 輸入解析度；run_pipeline.py --precision 也讀這個值
  onnx_opset: 17                # ONNX opset（TRT 10.x 最高相容版本）
  device:     "0"               # GPU device id
  precisions: [fp32, fp16, int8, fp8]   # 要導出的精度；移除不需要的項目即可

# ── INT8 PTQ ──────────────────────────────────────────────────────────────────
int8:
  calib_algo:  "entropy"   # 校正演算法：entropy | max（modelopt ONNX PTQ 支援的選項）
  # ↓ sensitivity analysis 後填入 PyTorch 模組名（如 "model.23.cv2.0.2"），自動轉成 ONNX 節點 regex
  skip_layers: []
  # ↓ 直接以 ONNX 節點名 regex 排除（進階用）。ultralytics 自家 INT8 流程排除的是
  #   [".*\\.2/Conv$", ".*/dfl/"]（head 輸出 conv 與 DFL，理由是精度），需要可自行填入
  nodes_to_exclude: []

# ── FP8 PTQ ───────────────────────────────────────────────────────────────────
fp8:
  calib_algo:  "entropy"   # entropy | max
  skip_layers: []
  nodes_to_exclude: []

# ── Sensitivity Analysis ──────────────────────────────────────────────────────
sensitivity:
  n_subset:  50        # 計算 output MSE 用的子集幀數（越大越準，越慢）
  precision: "int8"    # 對哪個精度做分析：int8 | fp8

# ── Comparison Report ─────────────────────────────────────────────────────────
compare:
  labels: [fp32, fp16, int8, fp8]
  out:    "outputs/comparison_table.md"
